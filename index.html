<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JFF Sanctuary | a closer friendship with Jesus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src='https://meet.jit.si/external_api.js'></script>
    <style>
        :root {
            --primary-jff: #1e646e; 
            --accent-jff: #f1b74a; 
            --glass-bg: rgba(255, 253, 249, 0.96);
        }
        
        body { 
            background: linear-gradient(135deg, #e0e7ff 0%, #fef3c7 50%, #d1fae5 100%);
            background-attachment: fixed;
            color: #333; 
            font-family: 'Inter', system-ui, sans-serif; 
            min-height: 100vh;
        }

        .content-overlay {
            background-color: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .tab-btn.active { border-color: var(--primary-jff); color: var(--primary-jff); font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        #jitsi-box.compact { height: 120px; overflow: hidden; }
        #jitsi-container { height: 500px; width: 100%; }
        
        .forum-msg { border-left: 4px solid var(--primary-jff); background: white; margin-bottom: 0.75rem; padding: 0.75rem; border-radius: 0.5rem; }
    </style>
</head>
<body class="p-0 m-0">

<header class="content-overlay p-4 shadow-sm sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 rounded-full overflow-hidden border-2 border-white shadow-md bg-white">
                <img src="FWWLogoMain.jpg" alt="JFF Logo" class="w-full h-full object-contain" onerror="this.src='https://via.placeholder.com/64?text=JFF'">
            </div>
            <div>
                <h1 class="text-xl font-bold text-stone-800">Jesus Friendship Fellowship</h1>
                <p class="text-xs italic text-stone-500">a closer friendship with Jesus</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://wa.me/2349031167282" target="_blank" class="flex items-center gap-2 bg-emerald-500 text-white px-4 py-2 rounded-full text-xs font-bold hover:bg-emerald-600 transition">
                <span>WhatsApp</span>
            </a>
            <div class="hidden lg:block">
                <iframe src="https://archive.org/embed/JesusFriendshipFellowshipMusic&autoplay=1" width="300" height="30" frameborder="0"></iframe>
            </div>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-10 space-y-10">
    
    <section class="content-overlay p-6 rounded-2xl shadow-lg border border-stone-100">
        <h2 class="text-lg font-semibold mb-4 text-stone-700">Prayer Requests</h2>
        <form id="prayerForm" class="flex flex-wrap gap-3">
            <input type="text" id="pName" placeholder="Your Name" class="p-2 rounded-lg border border-stone-200 text-sm flex-1 min-w-[150px]">
            <input type="text" id="pReq" placeholder="How can we pray for you today?" class="p-2 rounded-lg border border-stone-200 text-sm flex-[2] min-w-[250px]">
            <button type="submit" class="bg-[#1e646e] text-white px-6 py-2 rounded-lg text-sm font-bold hover:bg-opacity-90">Post Prayer</button>
        </form>
    </section>

    <section class="content-overlay p-6 rounded-2xl shadow-xl border border-stone-100">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-xl font-semibold text-stone-800">Bible Study Hub</h2>
            <div class="flex gap-2">
                <button onclick="openTab('step')" class="tab-btn active px-4 py-1 text-sm border-b-2">STEP Bible</button>
                <button onclick="openTab('extra')" class="tab-btn px-4 py-1 text-sm border-b-2 text-stone-400">Extra Tools</button>
            </div>
        </div>
        <div id="step" class="tab-content active h-[600px] rounded-lg overflow-hidden border">
            <iframe src="https://www.stepbible.org/?q=version=ESV|reference=John.1" class="w-full h-full"></iframe>
        </div>
        <div id="extra" class="tab-content h-[600px] rounded-lg overflow-hidden border">
            <iframe src="https://netbible.org/bible/John+1" class="w-full h-full"></iframe>
        </div>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <section class="content-overlay p-6 rounded-2xl shadow-xl border border-stone-100 flex flex-col">
            <h2 class="text-xl font-semibold mb-4 text-stone-800">Community Forum</h2>
            <div id="forum-login-gate" class="p-4 bg-white rounded-xl shadow-inner border border-stone-100 mb-4">
                <input type="text" id="user-handle" placeholder="Set your Fellowship Handle" class="w-full p-2 mb-3 border rounded-lg text-sm">
                <button onclick="loginToJFF()" class="w-full bg-[#f1b74a] text-white py-2 rounded-lg font-bold">Join Discussion</button>
            </div>
            <div id="forum-main" class="hidden flex-1 flex flex-col">
                <div id="forum-posts" class="flex-1 space-y-4 max-h-[350px] overflow-y-auto mb-4 pr-2">
                    <div class="forum-msg"><p class="text-xs text-stone-400 italic text-center">Fellowship reflections appear here.</p></div>
                </div>
                <div class="flex gap-2">
                    <input id="forum-input" placeholder="Share a word..." class="flex-1 p-2 border rounded-lg text-sm bg-white">
                    <button onclick="postToForum()" class="bg-[#1e646e] text-white px-4 py-2 rounded-lg font-bold text-sm">Post</button>
                </div>
            </div>
        </section>

        <section id="jitsi-box" class="content-overlay p-6 rounded-2xl shadow-xl border border-stone-100 compact transition-all duration-500 overflow-hidden">
            <h2 class="text-xl font-semibold mb-4 text-stone-800">Video Meetings</h2>
            <div id="jitsi-placeholder" class="text-center py-6">
                <p class="text-sm text-stone-500 mb-4">Click below to enter the live fellowship hall.</p>
                <button onclick="expandJitsi()" class="bg-[#f1b74a] text-white px-6 py-2 rounded-full font-bold shadow-md">Enter Meeting Hall</button>
            </div>
            <div id="jitsi-container"></div>
        </section>

    </div>
</main>

<script>
    function openTab(t) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(t).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    // Moderatable Jitsi Hall
    function expandJitsi() {
        document.getElementById('jitsi-box').classList.remove('compact');
        document.getElementById('jitsi-placeholder').style.display = 'none';
        const domain = "meet.jit.si";
        const options = {
            roomName: "JFF_Main_Fellowship_2026",
            width: '100%',
            height: 500,
            parentNode: document.querySelector('#jitsi-container'),
            configOverwrite: { 
                prejoinPageEnabled: true,
                startWithAudioMuted: true,
                startWithVideoMuted: true
            },
            interfaceConfigOverwrite: {
                TOOLBAR_BUTTONS: ['microphone', 'camera', 'closedcaptions', 'desktop', 'fullscreen', 'fodeviceselection', 'hangup', 'profile', 'chat', 'recording', 'livestreaming', 'etherpad', 'sharedvideo', 'settings', 'raisehand', 'videoquality', 'filmstrip', 'invite', 'feedback', 'stats', 'shortcuts', 'tileview', 'videobackgroundblur', 'download', 'help', 'mute-everyone', 'security']
            }
        };
        const api = new JitsiMeetExternalAPI(domain, options);
    }

    // Community Forum
    let currentUser = null;
    function loginToJFF() {
        const handle = document.getElementById('user-handle').value;
        if (handle.trim().length < 2) return alert("Please set a handle.");
        currentUser = handle;
        document.getElementById('forum-login-gate').style.display = 'none';
        document.getElementById('forum-main').classList.remove('hidden');
    }

    function postToForum() {
        const msg = document.getElementById('forum-input').value;
        if (!msg.trim()) return;
        const container = document.getElementById('forum-posts');
        const post = document.createElement('div');
        post.className = 'forum-msg';
        post.innerHTML = `<p class='text-[10px] font-bold text-[#1e646e] uppercase'>${currentUser}</p><p class='text-sm text-stone-700'>${msg}</p>`;
        container.prepend(post);
        document.getElementById('forum-input').value = '';
    }

    document.getElementById('prayerForm').onsubmit = (e) => {
        e.preventDefault();
        alert("Prayer request shared.");
        e.target.reset();
    };
</script>
</body>
</html>
